# The app for the iOS simulator, with the Rust core inside, started on a simulator to read the version it reports.
# The build is a Release one for the simulator: it carries its JavaScript, so no development server is needed
# (a development build opens on the launcher, which has no screen to read). The core's simulator slice is for Apple
# silicon (arm64), so the build is arm64 only. No Rust is installed or built here.
name: iOS simulator build

on:
  push:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Until a release of the core is pinned in marigold-core.json: the branch of marigoldcash/marigold whose latest Mobile core run is used.
      CORE_BRANCH: mobile/PH-M6b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Get the core
        run: scripts/ci-get-core.sh

      - name: Generate the native project
        run: npx expo prebuild --platform ios

      - name: Build for the simulator
        run: |
          xcodebuild -workspace ios/Marigold.xcworkspace -scheme Marigold -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
              grep -E "error:|fatal error|Error:" xcodebuild.log | sort -u | head -40
              tail -60 xcodebuild.log
              exit 1
            }
          tail -5 xcodebuild.log

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start a simulator, install the app, read the version
        env:
          # A fresh runner's simulator spends a minute migrating before Maestro's driver can start.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Marigold.app
          # Maestro's driver on a fresh simulator sometimes does not come up; the flows start from a clean state, so a second try is safe.
          maestro test .maestro || { xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b; maestro test .maestro; }

      # PH-M6b, as far as a simulator goes: it has no network to switch off, so the app is opened, put in the background for a
      # while and shown again.
      - name: Background and back
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          maestro test .maestro-network/1-open-and-leave.yaml
          sleep 60
          maestro test .maestro-network/background-and-back.yaml

      - name: What the app logged, when the background step failed
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | head -20
          for f in ~/Library/Logs/DiagnosticReports/Marigold*; do [ -f "$f" ] && head -60 "$f"; done
          xcrun simctl spawn booted log show --style compact --last 20m --predicate 'process == "Marigold"' 2>/dev/null | grep -iE "error|fatal|crash|abort|panic|terminat|signal" | head -60

      # Face ID through the simulator's own notifications is still being worked out (PH-M5 in PLAN.md): the flow runs and
      # reports, but does not fail the build.
      - name: Open with Face ID (not yet reliable)
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              for d in devices:
                  if d["state"] == "Booted":
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          # A face enrolled in the phone, answered from outside as a person's face would be.
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged
          (while true; do xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit_Sim.pearl.match; sleep 2; done) &
          FACE=$!
          maestro test .maestro-biometrics || { kill $FACE; exit 1; }
          kill $FACE


      - name: Keep what Maestro saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests
          if-no-files-found: ignore
