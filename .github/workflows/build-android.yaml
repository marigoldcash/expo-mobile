# The app for an Android emulator, with the Rust core inside, started to read the version it reports.
# A Release build carries its JavaScript, so no development server is needed. No Rust is installed or built here.
name: Android emulator build

on:
  push:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Until a release of the core is pinned in marigold-core.json: the branch of marigoldcash/marigold whose latest Mobile core run is used.
      CORE_BRANCH: mobile/PH-M6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Get the core
        run: scripts/ci-get-core.sh

      - name: Generate the native project
        run: npx expo prebuild --platform android

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: What the build generated, when it failed
        if: failure()
        run: |
          cat node_modules/expo/android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.kt || true
          cat android/settings.gradle || true
          find modules/marigold-core/android -type f | head -20
          find android/../modules/marigold-core/android/build -name '*.class' 2>/dev/null | head

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an emulator, install the app, read the version
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro

      - name: Keep what Maestro saw, when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests
          if-no-files-found: ignore
