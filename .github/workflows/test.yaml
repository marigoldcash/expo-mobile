# Tests for the app: types, unit tests and Expo's own project check. No Rust is built here.
name: Tests

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Expo's project check
        run: npx expo-doctor
